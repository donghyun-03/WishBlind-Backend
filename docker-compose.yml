services:
  mysql:
    image: mysql:8.4
    container_name: wishblind-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      # 앱이 root 계정으로 접속하므로 MYSQL_USER는 설정하지 않음 (root는 예약어라 MYSQL_USER로 생성 불가)
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wishblind-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8080
      # 상품 이미지 보강(Pexels). .env의 PEXELS_API_KEY를 컨테이너로 전달
      PEXELS_API_KEY: ${PEXELS_API_KEY}
      # Gemini(AI) 키. 없으면 규칙 기반 코멘트로 폴백
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # 초대 링크 베이스 = 받는 사람이 여는 '프론트엔드' 취향테스트 페이지 URL (백엔드 URL 아님)
      INVITE_BASE_URL: ${INVITE_BASE_URL:-http://localhost:8080/invite}
    ports:
      - "8080:8080"

volumes:
  mysql-data:
