spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:wishblind}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&zeroDateTimeBehavior=convertToNull&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 스키마는 Flyway가 만든다. 2명이 각자 로컬 DB를 쓰는데 ddl-auto=update는
  # 서로의 스키마가 조용히 갈라지게 두고, 컬럼 삭제나 타입 변경은 아예 반영하지 않는다.
  #
  # baseline-on-migrate: 이미 ddl-auto로 스키마가 만들어진 로컬 DB를 위한 설정이다.
  # V1을 실행하지 않고 "적용됨"으로만 기록한다. 빈 DB에서는 V1부터 정상 실행된다.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    open-in-view: false
    hibernate:
      # Flyway가 만든 스키마와 엔티티가 어긋나면 기동 시점에 실패시킨다.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# 인증
jwt:
  # ⚠ 아래 기본값은 로컬 개발 전용이다. 운영에서는 반드시 JWT_SECRET 환경변수로 덮어쓸 것.
  #   HS256 요구사항상 32바이트 이상이어야 하며, 짧으면 앱이 뜨지 않는다.
  secret: ${JWT_SECRET:local-dev-only-secret-change-me-32bytes+}
  access-token-validity: 1800      # 30분
  refresh-token-validity: 1209600  # 14일

# 소셜 로그인 토큰의 발급 대상 검증용 식별자(시크릿 아님).
# 비어 있으면 소셜 로그인을 거부한다 — 검증 없이 여는 것보다 막히는 편이 안전하다.
oauth:
  google-client-id: ${GOOGLE_CLIENT_ID:}
  kakao-app-id: ${KAKAO_APP_ID:}

# AI 연결. 키가 비어 있으면 규칙 기반 코멘트로 자동 대체된다(서비스는 정상 동작).
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-3.5-flash-lite
  max-output-tokens: 600
  timeout-seconds: 10

# 상품 이미지 보강(Pexels). 키가 비어 있으면 placeholder 이미지를 그대로 쓴다.
pexels:
  api-key: ${PEXELS_API_KEY:}

logging:
  level:
    org.hibernate.SQL: debug
